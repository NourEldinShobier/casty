<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casty</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
<div class="shell">
  <canvas id="video"></canvas>

  <div class="picker">
    <div class="card">
      <h3>Watch a screen</h3>
      <p>Devices on this network running Casty.</p>
      <div id="list"></div>
      <div class="scan" id="scan"></div>
      <div class="row"><input type="text" class="input" id="ip" placeholder="Or type an address, 192.168.1.20" aria-label="Address"><button class="btn default" id="go">Connect</button></div>
      <div class="err" id="err"></div>
      <div class="perm" id="perm" hidden><span id="permic"></span><span id="permtext">macOS needs Screen Recording access before this Mac can be watched.</span><button class="btn default sm" id="grant">Grant access</button></div>
      <div class="perm" id="neterr" hidden><span id="neterric"></span><span id="neterrtext"></span></div>
      <div class="foot"><span id="me"></span><button class="btn ghost icon tip" id="settings1" data-tip="Settings"></button></div>
    </div>
  </div>

  <div class="capsule">
    <div class="top" data-tauri-drag-region>
      <div class="left"><div class="lights"><button class="close" data-act="close" title="Close"></button><button class="min" data-act="min" title="Minimize"></button><button class="max" data-act="max" title="Zoom"></button></div><button class="rb" data-act="settings" title="Settings" id="settings2"></button></div>
      <i class="live"></i><b>Casting</b><span id="capsrc"></span>
      <div class="wcontrols pill">
        <button class="rb" data-act="min" title="Minimize" id="wc-min"></button>
        <button class="rb close" data-act="close" title="Close" id="wc-close"></button>
      </div>
    </div>
    <div class="viewers" id="viewers"></div>
    <div class="hint">Sound plays here unless a viewer or you route it to the viewers.</div>
    <div class="ctl">
      <div class="tabs" role="group" aria-label="Where sound plays" id="hroute">
        <button data-r="0" aria-pressed="true">Here</button>
        <button data-r="1" aria-pressed="false">Viewers</button>
        <button data-r="2" aria-pressed="false">Both</button>
      </div>
      <div class="vol" title="This machine's volume"><span id="hvolic"></span><input type="range" min="0" max="100" value="50" id="hvol" aria-label="Volume"><span class="mono" id="hvolv">50</span></div>
      <button class="btn outline sm" id="stopcast" title="Stop casting to everyone"></button>
    </div>
  </div>

  <div class="chrome">
    <div class="tbar" data-tauri-drag-region>
      <div class="left">
        <div class="lights"><button class="close" data-act="close" title="Close"></button><button class="min" data-act="min" title="Minimize"></button><button class="max" data-act="max" title="Zoom"></button></div>
        <div class="pill">
          <button class="rb tip" data-act="settings" data-tip="Settings" id="settings3"></button>
          <button class="rb tip" id="pin" data-tip="Keep on top" aria-pressed="true"></button>
        </div>
      </div>
      <div class="name"><span class="pill lbl"><i class="live" id="livedot"></i><span id="title">Casty</span></span></div>
      <div class="wcontrols pill">
        <button class="rb" data-act="min" title="Minimize" id="wc-min2"></button>
        <button class="rb" data-act="max" title="Maximize" id="wc-max"></button>
        <button class="rb close" data-act="close" title="Close" id="wc-close2"></button>
      </div>
    </div>
    <div class="bar pill">
      <button class="rb tip" id="pause" data-tip="Pause" aria-pressed="false"></button>
      <button class="rb tip" id="ctrlbtn" data-tip="Take control" aria-pressed="false"></button>
      <button class="rb tip" id="routebtn" data-tip="Sound plays on the PC"></button>
      <div class="vol tip" id="volbox" data-tip="Volume"><button class="rb" id="mute"></button><input type="range" min="0" max="100" value="50" id="vol" aria-label="Volume"></div>
      <div class="stats mono" id="stats"></div>
      <button class="rb tip wide" id="qbtn" data-tip="Quality and display" aria-haspopup="menu"><span id="qname">720p</span></button>
      <button class="rb tip" id="expand" data-tip="Expand"></button>
      <button class="rb tip" id="back" data-tip="Disconnect"></button>
    </div>
    <div class="menu popover" id="qmenu" role="menu"></div>
  </div>
  <div class="grip" id="grip" title="Resize"></div>
  <div class="edge n" data-d="North"></div><div class="edge s" data-d="South"></div><div class="edge e" data-d="East"></div><div class="edge w" data-d="West"></div>
  <div class="edge ne" data-d="NorthEast"></div><div class="edge nw" data-d="NorthWest"></div><div class="edge se" data-d="SouthEast"></div><div class="edge sw" data-d="SouthWest"></div>
</div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
