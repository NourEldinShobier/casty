<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casty</title>
<style>
  :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0; --dim:#94a3b8; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; min-height:100vh; }
  main { padding:20px; max-width:520px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .k { color:var(--dim); }
  .mono { font-family: ui-monospace, monospace; }
  button, select, input { font:inherit; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--fg); padding:10px 14px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#04121c; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .list button { width:100%; text-align:left; margin-top:8px; display:flex; justify-content:space-between; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { display:block; color:var(--dim); font-size:12px; margin-bottom:4px; }
  select, input { width:100%; }
  .link { background:none; border:none; color:var(--accent); padding:0; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b; margin-right:6px; }
  .dot.on { background:#22c55e; }
  #player { position:fixed; inset:0; background:#000; display:none; }
  #player.on { display:block; }
  #player canvas { width:100%; height:100%; object-fit:contain; display:block; }
  #hud { position:absolute; top:max(8px, env(safe-area-inset-top)); left:8px; right:8px; display:flex; justify-content:space-between; gap:8px; opacity:.9; }
  #hud .mono { background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px; font-size:12px; }
  #hud button { padding:6px 10px; font-size:13px; }
</style>
</head>
<body>
<main id="home"></main>
<div id="player">
  <canvas id="canvas"></canvas>
  <div id="hud"><span class="mono" id="stats">connecting…</span><button id="stop">Stop</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
