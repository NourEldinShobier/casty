[package]
name = "casty"
version = "0.2.1"
edition = "2021"

[lib]
name = "casty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
openh264 = "0.9"
yuv = "0.8"
fast_image_resize = "6"
axum = "0.8"
tokio-stream = "0.1"
hostname = "0.4"
local-ip-address = "0.6"
cpal = "0.15"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
scap = "0.1.0-beta.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
