name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # OpenH264's assembly path; without NASM the encoder is about 3x slower
      - uses: ilammy/setup-nasm@v1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm i -g @tauri-apps/cli@2
      # space-separated: PowerShell would turn "nsis,msi" into one bogus value
      - run: tauri build --bundles nsis msi
      - uses: actions/upload-artifact@v4
        with:
          name: casty-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: brew install nasm
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm i -g @tauri-apps/cli@2
      # macOS 26 shows an .icns-only app on a grey plate; the Liquid Glass icon lives in Assets.car
      - name: Compile the Liquid Glass icon
        run: >
          xcrun actool src-tauri/icons/AppIcon.icon --compile src-tauri
          --output-format human-readable-text --notices --warnings --errors
          --output-partial-info-plist "$RUNNER_TEMP/icon.plist" --app-icon AppIcon --include-all-app-icons
          --enable-on-demand-resources NO --development-region en --target-device mac
          --minimum-deployment-target 13.0 --platform macosx
      - run: tauri build --target universal-apple-darwin --bundles app dmg --config '{"bundle":{"resources":["Assets.car"]}}'
      - uses: actions/upload-artifact@v4
        with:
          name: casty-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # the Windows artifact keeps its nsis/ and msi/ folders, so collect files, not dist/*
      - run: find dist -type f
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" $(find dist -type f)
          --repo "$GITHUB_REPOSITORY" --title "Casty ${GITHUB_REF_NAME#v}" --generate-notes
