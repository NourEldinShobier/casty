name: mac
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - run: brew install nasm
      - run: npm i -g @tauri-apps/cli
      - name: Compile the Liquid Glass icon (macOS 26) into Assets.car
        run: |
          xcrun actool src-tauri/icons/AppIcon.icon --compile src-tauri --output-format human-readable-text --notices --warnings --errors --output-partial-info-plist /tmp/icon.plist --app-icon AppIcon --include-all-app-icons --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target 13.0 --platform macosx
          ls -la src-tauri/Assets.car
      - run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"resources":["Assets.car"]}}'
      - run: ls -la "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Casty.app/Contents/Resources" && plutil -p "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Casty.app/Contents/Info.plist" | grep -i icon
      - uses: actions/upload-artifact@v4
        with:
          name: casty-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
